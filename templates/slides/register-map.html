<aside class="notes"><p>Выбрать регистр, затем его часть и выполнить подготовленную mov. Пробел — записи в младшие 8, 16, 32 и все 64 бита. Shift + пробел — предыдущее действие, R — сброс. Значения учебные; расположение байтов показывает разряды числа, а не адреса памяти.</p></aside>
