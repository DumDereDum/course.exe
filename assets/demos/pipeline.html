<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Учебная модель конвейера</title><style>
*{box-sizing:border-box}body{margin:0;padding:5vmin;background:#0c1510;color:#e4eee6;font:clamp(12px,2.2vw,22px)/1.6 system-ui,sans-serif}small{color:#91a99a;font: .65em monospace;text-transform:uppercase;letter-spacing:.1em}.stages{display:flex;gap:2vw;margin:4vmin 0}.stage{flex:1;border:1px solid #2b4434;padding:2vmin;color:#91a99a}.stage.done{border-color:#89f9b0;color:#89f9b0;background:#152b1d}.stage span{display:block;font: .65em monospace}button{font:inherit;font-size:.7em;padding:.8em 1em;border:1px solid #89f9b0;background:#89f9b0;color:#0c1510;cursor:pointer}button+button{background:none;color:#89f9b0}button:disabled{opacity:.4}button:focus-visible{outline:2px solid white;outline-offset:4px}#message{min-height:2em;font-size:.8em;margin-bottom:3vmin}
</style></head><body><small>Подготовленная модель / команды не выполняются</small><div class="stages"><div class="stage"><span>01 / BUILD</span>Сборка</div><div class="stage"><span>02 / TEST</span>Тесты</div><div class="stage"><span>03 / ARTIFACT</span>Артефакт</div></div><p id="message" aria-live="polite"></p><button id="next">Следующий этап →</button> <button id="reset">Сброс</button><script>
let step=0;const messages=['Исходники готовы. Начнём сборку.','Сборка завершена. Теперь проверим результат тестами.','Тесты пройдены. Можно подготовить артефакт.','Артефакт готов. Все три этапа завершены.'];function render(){document.querySelectorAll('.stage').forEach((el,i)=>el.classList.toggle('done',i<step));document.getElementById('message').textContent=messages[step];document.getElementById('next').disabled=step===3;document.getElementById('reset').disabled=step===0;}document.getElementById('next').onclick=()=>{step=Math.min(3,step+1);render();};document.getElementById('reset').onclick=()=>{step=0;render();};render();
</script></body></html>
