<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
<title id="title">RIP — состояние 1</title>
<desc id="desc">RIP = 0x401000: следующей будет выполнена mov rax, rbx. Адреса начала инструкций и длины: 0x401000 — 3 байта, 0x401003 — 3 байта, 0x401006 — 4 байта; продолжение начинается с 0x40100A.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#89f9b0" /></marker></defs>
<text x="28" y="28" fill="#91a99a" font-size="21" font-family="Inter, Arial, sans-serif" text-anchor="start">КОД В ПАМЯТИ · ФРАГМЕНТ .text</text>
<rect x="24" y="48" width="906" height="350" rx="10" fill="#0c1510" stroke="#40614b" stroke-width="2" />
<text x="45" y="80" fill="#91a99a" font-size="18" font-family="Inter, Arial, sans-serif" text-anchor="start">АДРЕС</text>
<text x="245" y="80" fill="#91a99a" font-size="18" font-family="Inter, Arial, sans-serif" text-anchor="start">БАЙТЫ</text>
<text x="510" y="80" fill="#91a99a" font-size="18" font-family="Inter, Arial, sans-serif" text-anchor="start">ИНСТРУКЦИЯ</text>
<text x="852" y="80" fill="#91a99a" font-size="18" font-family="Inter, Arial, sans-serif" text-anchor="middle">БАЙТ</text>
<path d="M25 98H929" stroke="#40614b" />
<rect x="25" y="103" width="904" height="68" rx="6" fill="#153020" />
<path d="M26 103V171" stroke="#89f9b0" stroke-width="4" />
<text x="45" y="146" fill="#89f9b0" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">0x401000</text>
<g data-byte="48" data-byte-hint="Префикс REX.W: следующие операнды имеют размер 64 бита."><rect class="byte-hit" x="240" y="119" width="40" height="34" rx="4" fill="transparent" /><text x="245" y="146" fill="#89f9b0" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">48</text></g><g data-byte="89" data-byte-hint="MOV: копирование из регистра в регистр или память. Здесь mov rax, rbx."><rect class="byte-hit" x="285" y="119" width="40" height="34" rx="4" fill="transparent" /><text x="290" y="146" fill="#89f9b0" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">89</text></g><g data-byte="D8" data-byte-hint="ModR/M: оба операнда — регистры; источник RBX, назначение RAX."><rect class="byte-hit" x="330" y="119" width="40" height="34" rx="4" fill="transparent" /><text x="335" y="146" fill="#89f9b0" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">D8</text></g><text x="510" y="146" fill="#89f9b0" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">mov rax, rbx</text>
<text x="852" y="146" fill="#89f9b0" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">3</text>
<text x="45" y="218" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">0x401003</text>
<g data-byte="48" data-byte-hint="Префикс REX.W: следующие операнды имеют размер 64 бита."><rect class="byte-hit" x="240" y="191" width="40" height="34" rx="4" fill="transparent" /><text x="245" y="218" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">48</text></g><g data-byte="01" data-byte-hint="ADD: прибавить регистр к регистру или памяти. Здесь add rax, rcx."><rect class="byte-hit" x="285" y="191" width="40" height="34" rx="4" fill="transparent" /><text x="290" y="218" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">01</text></g><g data-byte="C8" data-byte-hint="ModR/M: оба операнда — регистры; источник RCX, назначение RAX."><rect class="byte-hit" x="330" y="191" width="40" height="34" rx="4" fill="transparent" /><text x="335" y="218" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">C8</text></g><text x="510" y="218" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">add rax, rcx</text>
<text x="852" y="218" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">3</text>
<text x="45" y="290" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">0x401006</text>
<g data-byte="48" data-byte-hint="Префикс REX.W: следующие операнды имеют размер 64 бита."><rect class="byte-hit" x="240" y="263" width="40" height="34" rx="4" fill="transparent" /><text x="245" y="290" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">48</text></g><g data-byte="83" data-byte-hint="Группа арифметики с 8-битной константой. Конкретную операцию задаёт следующий байт ModR/M."><rect class="byte-hit" x="285" y="263" width="40" height="34" rx="4" fill="transparent" /><text x="290" y="290" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">83</text></g><g data-byte="E8" data-byte-hint="ModR/M: код операции /5 выбирает SUB; назначение — регистр RAX."><rect class="byte-hit" x="330" y="263" width="40" height="34" rx="4" fill="transparent" /><text x="335" y="290" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">E8</text></g><g data-byte="01" data-byte-hint="Константа +1: один байт, расширяется со знаком до размера операнда."><rect class="byte-hit" x="375" y="263" width="40" height="34" rx="4" fill="transparent" /><text x="380" y="290" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">01</text></g><text x="510" y="290" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">sub rax, 1</text>
<text x="852" y="290" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">4</text>
<text x="45" y="362" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">0x40100A</text>
<text x="245" y="362" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">…</text>
<text x="510" y="362" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">дальше…</text>
<text x="852" y="362" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">—</text>
<rect x="1030" y="48" width="346" height="183" rx="10" fill="#153020" stroke="#89f9b0" stroke-width="3" />
<text x="1203" y="93" fill="#89f9b0" font-size="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">RIP</text>
<text x="1203" y="148" fill="#e4eee6" font-size="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">0x401000</text>
<text x="1203" y="197" fill="#91a99a" font-size="21" font-family="Inter, Arial, sans-serif" text-anchor="middle">адрес следующей инструкции</text>
<path d="M1030 139H978V137H932" fill="none" stroke="#89f9b0" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)" />
<rect x="1030" y="257" width="346" height="141" rx="10" fill="#0c1510" stroke="#40614b" stroke-width="2" />
<text x="1203" y="292" fill="#91a99a" font-size="18" font-family="Inter, Arial, sans-serif" text-anchor="middle">НАЧАЛЬНОЕ СОСТОЯНИЕ</text>
<text x="1203" y="340" fill="#e4eee6" font-size="23" font-family="Inter, Arial, sans-serif" text-anchor="middle">Перед выполнением</text>
<text x="1203" y="373" fill="#e4eee6" font-size="23" font-family="Inter, Arial, sans-serif" text-anchor="middle">первой инструкции</text>
<text x="28" y="426" fill="#91a99a" font-size="19" font-family="Inter, Arial, sans-serif" text-anchor="start">Адреса условные. Инструкции занимают разное число байтов.</text>
</svg>
