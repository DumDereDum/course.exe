<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc"><title id="title">Чтение числа через Data Inspector</title><desc id="desc">Инспектор читает четыре байта с позиции 0x1001 как Int32 little-endian: минус семь.</desc><text x="24" y="30" fill="#91a99a" font-size="22" font-family="Inter, Arial, sans-serif">DATA INSPECTOR · ВЫБРАТЬ F9 ПО СМЕЩЕНИЮ 0x1001</text><text x="24" y="94" fill="#89f9b0" font-size="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">mov eax, -7</text><rect x="36" y="120" width="95" height="78" rx="8" fill="#0c1510" stroke="#40614b" stroke-width="2"/><g data-byte="B8" data-byte-hint="MOV EAX, imm32: записать 32-битную константу в EAX."><rect class="byte-hit" x="58" y="145" width="42" height="36" rx="4" fill="transparent"/><text x="62" y="172" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">B8</text></g><rect x="161" y="120" width="95" height="78" rx="8" fill="#153020" stroke="#89f9b0" stroke-width="2"/><g data-byte="F9" data-byte-hint="Байт 1 из 4 числа −7: F9 FF FF FF; little-endian, младший байт первым."><rect class="byte-hit" x="183" y="145" width="42" height="36" rx="4" fill="transparent"/><text x="187" y="172" fill="#89f9b0" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">F9</text></g><rect x="286" y="120" width="95" height="78" rx="8" fill="#153020" stroke="#89f9b0" stroke-width="2"/><g data-byte="FF" data-byte-hint="Байт 2 из 4 числа −7: F9 FF FF FF; little-endian, младший байт первым."><rect class="byte-hit" x="308" y="145" width="42" height="36" rx="4" fill="transparent"/><text x="312" y="172" fill="#89f9b0" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">FF</text></g><rect x="411" y="120" width="95" height="78" rx="8" fill="#153020" stroke="#89f9b0" stroke-width="2"/><g data-byte="FF" data-byte-hint="Байт 3 из 4 числа −7: F9 FF FF FF; little-endian, младший байт первым."><rect class="byte-hit" x="433" y="145" width="42" height="36" rx="4" fill="transparent"/><text x="437" y="172" fill="#89f9b0" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">FF</text></g><rect x="536" y="120" width="95" height="78" rx="8" fill="#153020" stroke="#89f9b0" stroke-width="2"/><g data-byte="FF" data-byte-hint="Байт 4 из 4 числа −7: F9 FF FF FF; little-endian, младший байт первым."><rect class="byte-hit" x="558" y="145" width="42" height="36" rx="4" fill="transparent"/><text x="562" y="172" fill="#89f9b0" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">FF</text></g><text x="44" y="238" fill="#91a99a" font-size="24" font-family="Inter, Arial, sans-serif">команда</text><text x="197" y="238" fill="#89f9b0" font-size="27" font-family="Inter, Arial, sans-serif">число: четыре байта</text><text x="24" y="304" fill="#89f9b0" font-size="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">F9 FF FF FF → 0xFFFFFFF9</text><text x="24" y="355" fill="#e4eee6" font-size="27" font-family="Inter, Arial, sans-serif">Little Endian: младший байт первым.</text><rect x="825" y="66" width="550" height="294" rx="8" fill="#0c1510" stroke="#40614b" stroke-width="2"/><text x="850" y="106" fill="#89f9b0" font-size="29" font-family="Inter, Arial, sans-serif">Data Inspector</text><text x="850" y="151" fill="#91a99a" font-size="25" font-family="Inter, Arial, sans-serif">Начало: 0x1001 · Little Endian</text><text x="850" y="207" fill="#e4eee6" font-size="29" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Int32</text><text x="1080" y="207" fill="#89f9b0" font-size="40" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">−7</text><text x="850" y="265" fill="#e4eee6" font-size="29" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Uint32</text><text x="1040" y="265" fill="#e4eee6" font-size="29" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">4294967289</text><text x="850" y="326" fill="#e4eee6" font-size="25" font-family="Inter, Arial, sans-serif">Те же 32 бита, разная трактовка.</text><text x="24" y="415" fill="#91a99a" font-size="25" font-family="Inter, Arial, sans-serif">Выбираем первый байт числа — F9. B8 остаётся частью кодировки MOV.</text></svg>
