<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc"><title id="title">Ошибка трактовки чисел</title><desc id="desc">Знаковый максимум · EAX=−1 · EBX=1. JB пропущена → выбрано −1. Исправление: JL сработала → выбрано 1.</desc><text x="700" y="30" font-size="25" fill="#e4eee6" text-anchor="middle" font-family="Inter, Arial, sans-serif">Знаковый максимум · EAX=−1 · EBX=1</text><rect x="30" y="60" width="640" height="310" rx="10" fill="#0c1510" stroke="#40614b" stroke-width="2" /><text x="58" y="97" font-size="23" fill="#91a99a" text-anchor="start" font-family="Inter, Arial, sans-serif">ОШИБКА</text><text x="58" y="133" font-size="18" fill="#91a99a" text-anchor="start" font-family="Inter, Arial, sans-serif">БАЙТЫ</text><text x="255" y="133" font-size="18" fill="#91a99a" text-anchor="start" font-family="Inter, Arial, sans-serif">ИНСТРУКЦИЯ</text><text x="255" y="178" font-size="29" fill="#e4eee6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cmp eax, ebx</text><g data-byte="39" data-byte-hint="CMP r/m32,r32: вычитание для флагов без записи результата."><rect class="byte-hit" x="53" y="149" width="44" height="36" rx="4" fill="transparent" /><text x="58" y="178" font-size="27" fill="#e4eee6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">39</text></g><g data-byte="D8" data-byte-hint="ModR/M: 11 | 011 | 000. Флаги по EAX−EBX; регистры сохраняются."><rect class="byte-hit" x="102" y="149" width="44" height="36" rx="4" fill="transparent" /><text x="107" y="178" font-size="27" fill="#e4eee6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">D8</text></g><text x="255" y="227" font-size="29" fill="#e4eee6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">jb use_b</text><g data-byte="72" data-byte-hint="JB: беззнаковое «меньше», переход при CF=1."><rect class="byte-hit" x="53" y="198" width="44" height="36" rx="4" fill="transparent" /><text x="58" y="227" font-size="27" fill="#e4eee6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">72</text></g><g data-byte="04" data-byte-hint="Смещение +4 до use_b в фрагменте максимума, от конца JB."><rect class="byte-hit" x="102" y="198" width="44" height="36" rx="4" fill="transparent" /><text x="107" y="227" font-size="27" fill="#e4eee6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">04</text></g><text x="58" y="313" font-size="24" fill="#91a99a" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">CF=0 · SF=1 · OF=0</text><text x="58" y="351" font-size="25" fill="#91a99a" text-anchor="start" font-family="Inter, Arial, sans-serif">JB пропущена → выбрано −1</text><rect x="730" y="60" width="640" height="310" rx="10" fill="#0c1510" stroke="#89f9b0" stroke-width="2" /><text x="758" y="97" font-size="23" fill="#89f9b0" text-anchor="start" font-family="Inter, Arial, sans-serif">ИСПРАВЛЕНИЕ</text><text x="758" y="133" font-size="18" fill="#91a99a" text-anchor="start" font-family="Inter, Arial, sans-serif">БАЙТЫ</text><text x="955" y="133" font-size="18" fill="#91a99a" text-anchor="start" font-family="Inter, Arial, sans-serif">ИНСТРУКЦИЯ</text><text x="955" y="178" font-size="29" fill="#89f9b0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cmp eax, ebx</text><g data-byte="39" data-byte-hint="CMP r/m32,r32: вычитание для флагов без записи результата."><rect class="byte-hit" x="753" y="149" width="44" height="36" rx="4" fill="transparent" /><text x="758" y="178" font-size="27" fill="#e4eee6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">39</text></g><g data-byte="D8" data-byte-hint="ModR/M: 11 | 011 | 000. Флаги по EAX−EBX; регистры сохраняются."><rect class="byte-hit" x="802" y="149" width="44" height="36" rx="4" fill="transparent" /><text x="807" y="178" font-size="27" fill="#e4eee6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">D8</text></g><text x="955" y="227" font-size="29" fill="#89f9b0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">jl use_b</text><g data-byte="7C" data-byte-hint="JL: знаковое «меньше», переход при SF≠OF."><rect class="byte-hit" x="753" y="198" width="44" height="36" rx="4" fill="transparent" /><text x="758" y="227" font-size="27" fill="#e4eee6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">7C</text></g><g data-byte="04" data-byte-hint="Смещение +4 до use_b в фрагменте максимума, от конца JL."><rect class="byte-hit" x="802" y="198" width="44" height="36" rx="4" fill="transparent" /><text x="807" y="227" font-size="27" fill="#e4eee6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">04</text></g><text x="758" y="313" font-size="24" fill="#91a99a" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">CF=0 · SF=1 · OF=0</text><text x="758" y="351" font-size="25" fill="#89f9b0" text-anchor="start" font-family="Inter, Arial, sans-serif">JL сработала → выбрано 1</text><text x="700" y="416" font-size="26" fill="#89f9b0" text-anchor="middle" font-family="Inter, Arial, sans-serif">Трактовка: для знаковых чисел выбираем знаковые переходы.</text></svg>
