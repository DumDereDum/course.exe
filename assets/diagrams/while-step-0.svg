<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1740 430" role="img" aria-labelledby="title desc">
<title id="title">WHILE: возврат к проверке и выход из цикла</title>
<desc id="desc">Слева код C, в центре CMP/JGE/INC/JMP с байтами, справа RIP, счётчик EAX, граница EBX, SF/OF и число итераций.</desc>
<defs><marker id="green" data-jump-marker="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#89f9b0" /></marker><marker id="muted" data-jump-marker="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#40614b" /></marker></defs>
<g transform="translate(340 0)"><text x="28" y="28" fill="#91a99a" font-size="21" font-family="Inter, Arial, sans-serif" text-anchor="start">КОД В ПАМЯТИ · ФРАГМЕНТ .text</text>
<rect x="24" y="48" width="906" height="350" rx="10" fill="#0c1510" stroke="#40614b" stroke-width="2" />
<text x="45" y="80" fill="#91a99a" font-size="18" font-family="Inter, Arial, sans-serif" text-anchor="start">АДРЕС</text>
<text x="230" y="80" fill="#91a99a" font-size="18" font-family="Inter, Arial, sans-serif" text-anchor="start">БАЙТЫ</text>
<text x="480" y="80" fill="#91a99a" font-size="18" font-family="Inter, Arial, sans-serif" text-anchor="start">МЕТКА</text>
<text x="595" y="80" fill="#91a99a" font-size="18" font-family="Inter, Arial, sans-serif" text-anchor="start">ИНСТРУКЦИЯ</text>
<path d="M25 98H929" stroke="#40614b" />
<g data-jump-row="0">
<rect class="jump-highlight" x="25" y="101" width="904" height="46" rx="6" fill="#153020" opacity="1" />
<text x="45" y="135" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">0x401000</text>
<text x="480" y="135" fill="#89f9b0" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" class="jump-label" />
<text x="595" y="135" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">cmp eax, ebx</text>
<g data-byte="39" data-byte-hint="CMP: вычислить EAX − EBX для обновления флагов. Значения регистров не меняются.">
<rect class="byte-hit" x="225" y="108" width="40" height="34" rx="4" fill="transparent" />
<text x="230" y="135" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">39</text>
</g>
<g data-byte="D8" data-byte-hint="ModR/M: 11 | 011 | 000 — оба операнда в регистрах; второй EBX, первый EAX.">
<rect class="byte-hit" x="270" y="108" width="40" height="34" rx="4" fill="transparent" />
<text x="275" y="135" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">D8</text>
</g>
<text x="480" y="135" fill="#89f9b0" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" class="jump-label">check:</text></g>
<g data-jump-row="1">
<rect class="jump-highlight" x="25" y="149" width="904" height="46" rx="6" fill="#153020" opacity="0" />
<text x="45" y="183" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">0x401002</text>
<text x="480" y="183" fill="#89f9b0" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" class="jump-label" />
<text x="595" y="183" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" data-jump-instruction="">jge done</text>
<g data-byte="7D" data-byte-hint="JGE: короткий знаковый переход, если SF = OF. После CMP EAX,EBX это выход при EAX ≥ EBX. Флаги сохраняются." data-jump-opcode="">
<rect class="byte-hit" x="225" y="156" width="40" height="34" rx="4" fill="transparent" />
<text x="230" y="183" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">7D</text>
</g>
<g data-byte="04" data-byte-hint="Смещение +4 байта: 0x401004 + 4 = 0x401008 (done). Отсчёт от конца JGE.">
<rect class="byte-hit" x="270" y="156" width="40" height="34" rx="4" fill="transparent" />
<text x="275" y="183" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">04</text>
</g>
</g>
<g data-jump-row="2">
<rect class="jump-highlight" x="25" y="197" width="904" height="46" rx="6" fill="#153020" opacity="0" />
<text x="45" y="231" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">0x401004</text>
<text x="480" y="231" fill="#89f9b0" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" class="jump-label" />
<text x="595" y="231" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">inc eax</text>
<g data-byte="FF" data-byte-hint="Код группы инструкций FF для 32-битного операнда. Расширение /0 в следующем ModR/M выбирает INC: прибавить 1."><rect class="byte-hit" x="225" y="193" width="40" height="34" rx="4" fill="transparent" /><text x="230" y="231" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">FF</text></g><g data-byte="C0" data-byte-hint="ModR/M: 11 | 000 | 000. 11 — регистр, /0 — операция INC, r/m=000 — EAX. INC EAX обновляет SF/OF и другие флаги, сохраняя CF."><rect class="byte-hit" x="270" y="193" width="40" height="34" rx="4" fill="transparent" /><text x="275" y="231" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">C0</text></g></g>
<g data-jump-row="3">
<rect class="jump-highlight" x="25" y="245" width="904" height="46" rx="6" fill="#153020" opacity="0" />
<text x="45" y="279" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">0x401006</text>
<text x="480" y="279" fill="#89f9b0" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" class="jump-label" />
<text x="595" y="279" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">jmp check</text>
<g data-byte="EB" data-byte-hint="JMP: короткий безусловный переход. ZF не проверяет и не изменяет.">
<rect class="byte-hit" x="225" y="252" width="40" height="34" rx="4" fill="transparent" />
<text x="230" y="279" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">EB</text>
</g>
<g data-byte="F8" data-byte-hint="Знаковое 8-битное смещение −8: F8 = 11111000 в дополнительном коде. 0x401008 − 8 = 0x401000 (check). Отсчёт от конца JMP.">
<rect class="byte-hit" x="270" y="252" width="40" height="34" rx="4" fill="transparent" />
<text x="275" y="279" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">F8</text>
</g>
</g>
<g data-jump-row="4">
<rect class="jump-highlight" x="25" y="293" width="904" height="46" rx="6" fill="#153020" opacity="0" />
<text x="45" y="327" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">0x401008</text>
<text x="480" y="327" fill="#89f9b0" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" class="jump-label">done:</text>
<text x="595" y="327" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">дальше…</text>
<text x="230" y="327" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">…</text>
</g>
<path data-branch-path="" d="M799 172H900V316H799" fill="none" stroke="#40614b" stroke-width="2" marker-end="url(#muted)" />
<path data-fallthrough-path="" d="M799 172V220" fill="none" stroke="#40614b" stroke-width="2" marker-end="url(#muted)" />
<path data-done-path="" d="M799 268H879V124H799" fill="none" stroke="#40614b" stroke-width="2" marker-end="url(#muted)" />
<rect x="1030" y="48" width="346" height="106" rx="10" fill="#153020" stroke="#89f9b0" stroke-width="3" />
<text x="1203" y="85" fill="#89f9b0" font-size="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">RIP</text>
<text x="1203" y="129" fill="#e4eee6" font-size="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" data-jump-rip="">0x401000</text>
<path data-jump-pointer="" d="M1030 111H978V124H932" fill="none" stroke="#89f9b0" stroke-width="3" marker-end="url(#green)" />
<rect x="1030" y="175" width="346" height="99" rx="10" fill="#0c1510" stroke="#40614b" stroke-width="2" />
<path d="M1203 175V274" stroke="#40614b" />
<text x="1117" y="208" fill="#89f9b0" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">EAX</text>
<text x="1289" y="208" fill="#89f9b0" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">EBX</text>
<text x="1117" y="253" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" data-jump-eax="">0</text>
<text x="1289" y="253" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" data-jump-ebx="">3</text>
<rect x="1030" y="296" width="346" height="102" rx="10" fill="#0c1510" stroke="#40614b" stroke-width="2" />
<text x="28" y="420" fill="#91a99a" font-size="20" font-family="Inter, Arial, sans-serif" text-anchor="start">JGE проверяет выход i ≥ limit · JMP возвращает к новой проверке</text>
<text x="1362" y="384" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end" data-loop-iterations="">0</text><path d="M1203 296V347M1030 347H1376" stroke="#40614b" /><g data-order-flag="sf"><rect class="order-highlight" x="1031" y="297" width="171" height="49" rx="6" fill="#153020" stroke="#89f9b0" stroke-width="1.5" opacity="0" /><text x="1053" y="331" fill="#89f9b0" font-size="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">SF</text><text x="1152" y="333" fill="#e4eee6" font-size="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" data-jump-sf="">—</text></g><g data-order-flag="of"><rect class="order-highlight" x="1204" y="297" width="171" height="49" rx="6" fill="#153020" stroke="#89f9b0" stroke-width="1.5" opacity="0" /><text x="1226" y="331" fill="#89f9b0" font-size="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">OF</text><text x="1325" y="333" fill="#e4eee6" font-size="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" data-jump-of="">—</text></g><text x="1053" y="382" fill="#89f9b0" font-size="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">итераций</text><text x="1030" y="289" fill="#91a99a" font-size="18" font-family="Inter, Arial, sans-serif" data-loop-flag-source="">Флаги от: —</text><text x="45" y="374" fill="#91a99a" font-size="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" data-loop-history="">EAX: 0</text></g><rect x="10" y="48" width="310" height="339" rx="10" fill="#0c1510" stroke="#40614b" stroke-width="2" /><text x="28" y="84" fill="#91a99a" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">C · signed int</text><text x="28" y="136" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve" data-loop-cline="condition">while (i &lt; limit)</text><text x="28" y="176" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">{</text><text x="28" y="216" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve" data-loop-cline="body">  i++;</text><text x="28" y="256" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve" data-loop-cline="exit">}</text><text x="28" y="332" fill="#91a99a" font-size="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">i → EAX</text><text x="28" y="363" fill="#91a99a" font-size="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">limit → EBX</text></svg>
