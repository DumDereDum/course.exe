<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 300" role="img"><rect width="1400" height="300" fill="none"/><text x="40" y="28" fill="#91a99a" font-size="20" font-family="Inter, Arial, sans-serif" xml:space="preserve" text-anchor="start">ГЕНЕРАЦИЯ · ШАГ 5 ИЗ 5</text><text x="40" y="58" fill="#91a99a" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve" text-anchor="start">&gt; Объясни в одном предложении,</text><text x="40" y="82" fill="#91a99a" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve" text-anchor="start">  что такое Git.</text><path d="M40 96H800" stroke="#2b4434" stroke-width="2"/><rect x="40" y="118" width="82.4" height="54" rx="9" fill="#152b20" stroke="#40614b" stroke-width="2"/><text x="56" y="155.08" fill="#e4eee6" font-size="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve" text-anchor="start">Git</text><rect x="132.4" y="118" width="48.8" height="54" rx="9" fill="#152b20" stroke="#40614b" stroke-width="2"/><text x="148.4" y="155.08" fill="#e4eee6" font-size="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve" text-anchor="start">—</text><rect x="191.2" y="118" width="149.6" height="54" rx="9" fill="#152b20" stroke="#40614b" stroke-width="2"/><text x="207.2" y="155.08" fill="#e4eee6" font-size="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve" text-anchor="start">система</text><rect x="350.8" y="118" width="166.4" height="54" rx="9" fill="#152b20" stroke="#40614b" stroke-width="2"/><text x="366.8" y="155.08" fill="#e4eee6" font-size="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve" text-anchor="start">контроля</text><rect x="527.2" y="118" width="132.8" height="54" rx="9" fill="#152b20" stroke="#40614b" stroke-width="2"/><text x="543.2" y="155.08" fill="#e4eee6" font-size="28" font-family="ui-monospace, SFMon