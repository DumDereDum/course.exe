<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc"><title id="title">Изменение флагов перед JE</title><desc id="desc">Проверяем равенство · EAX=7 · EBX=7 · ECX=0. JE пропущена, хотя 7=7. Исправление: JE сработала: числа равны.</desc><text x="700" y="30" font-size="25" fill="#e4eee6" text-anchor="middle" font-family="Inter, Arial, sans-serif">Проверяем равенство · EAX=7 · EBX=7 · ECX=0</text><rect x="30" y="60" width="640" height="310" rx="10" fill="#0c1510" stroke="#40614b" stroke-width="2" /><text x="58" y="97" font-size="23" fill="#91a99a" text-anchor="start" font-family="Inter, Arial, sans-serif">ОШИБКА</text><text x="58" y="133" font-size="18" fill="#91a99a" text-anchor="start" font-family="Inter, Arial, sans-serif">БАЙТЫ</text><text x="255" y="133" font-size="18" fill="#91a99a" text-anchor="start" font-family="Inter, Arial, sans-serif">ИНСТРУКЦИЯ</text><text x="255" y="178" font-size="29" fill="#e4eee6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cmp eax, ebx</text><g data-byte="39" data-byte-hint="CMP r/m32,r32: вычитание для флагов без записи результата."><rect class="byte-hit" x="53" y="149" width="44" height="36" rx="4" fill="transparent" /><text x="58" y="178" font-size="27" fill="#e4eee6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">39</text></g><g data-byte="D8" data-byte-hint="ModR/M: 11 | 011 | 000. Флаги по EAX−EBX; регистры сохраняются."><rect class="byte-hit" x="102" y="149" width="44" height="36" rx="4" fill="transparent" /><text x="107" y="178" font-size="27" fill="#e4eee6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">D8</text></g><text x="255" y="227" font-size="29" fill="#e4eee6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">inc ecx</text><g data-byte="FF" data-byte-hint="Группа FF, операция INC /0 задаётся следующим ModR/M."><rect class="byte-hit" x="53" y="198" width="44" height="36" rx="4" fill="transparent" /><text x="58" y="227" font-size="27" fill="#e4eee6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">FF</text></g><g data-byte="C1" data-byte-hint="ModR/M: 11 | 000 | 001. INC ECX: прибавить 1; ZF обновляется, CF сохраняется."><rect class="byte-hit" x="102" y="198" width="44" height="36" rx="4" fill="transparent" /><text x="107" y="227" font-size="27" fill="#e4eee6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">C1</text></g><text x="255" y="276" font-size="29" fill="#e4eee6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">je equal</text><g data-byte="74" data-byte-hint="JE: переход при текущем ZF=1. Предыдущие сравнения не запоминает."><rect class="byte-hit" x="53" y="247" width="44" height="36" rx="4" fill="transparent" /><text x="58" y="276" font-size="27" fill="#e4eee6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">74</text></g><g data-byte="07" data-byte-hint="Смещение +7 до equal в примере с двумя ветками, от конца JE."><rect class="byte-hit" x="102" y="247" width="44" height="36" rx="4" fill="transparent" /><text x="107" y="276" font-size="27" fill="#e4eee6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">07</text></g><text x="58" y="313" font-size="24" fill="#91a99a" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ZF: 1 от CMP → 0 от INC</text><text x="58" y="351" font-size="25" fill="#91a99a" text-anchor="start" font-family="Inter, Arial, sans-serif">JE пропущена, хотя 7=7</text><rect x="730" y="60" width="640" height="310" rx="10" fill="#0c1510" stroke="#89f9b0" stroke-width="2" /><text x="758" y="97" font-size="23" fill="#89f9b0" text-anchor="start" font-family="Inter, Arial, sans-serif">ИСПРАВЛЕНИЕ</text><text x="758" y="133" font-size="18" fill="#91a99a" text-anchor="start" font-family="Inter, Arial, sans-serif">БАЙТЫ</text><text x="955" y="133" font-size="18" fill="#91a99a" text-anchor="start" font-family="Inter, Arial, sans-serif">ИНСТРУКЦИЯ</text><text x="955" y="178" font-size="29" fill="#89f9b0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">inc ecx</text><g data-byte="FF" data-byte-hint="Группа FF, операция INC /0 задаётся следующим ModR/M."><rect class="byte-hit" x="753" y="149" width="44" height="36" rx="4" fill="transparent" /><text x="758" y="178" font-size="27" fill="#e4eee6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">FF</text></g><g data-byte="C1" data-byte-hint="ModR/M: 11 | 000 | 001. INC ECX: прибавить 1; ZF обновляется, CF сохраняется."><rect class="byte-hit" x="802" y="149" width="44" height="36" rx="4" fill="transparent" /><text x="807" y="178" font-size="27" fill="#e4eee6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">C1</text></g><text x="955" y="227" font-size="29" fill="#89f9b0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cmp eax, ebx</text><g data-byte="39" data-byte-hint="CMP r/m32,r32: вычитание для флагов без записи результата."><rect class="byte-hit" x="753" y="198" width="44" height="36" rx="4" fill="transparent" /><text x="758" y="227" font-size="27" fill="#e4eee6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">39</text></g><g data-byte="D8" data-byte-hint="ModR/M: 11 | 011 | 000. Флаги по EAX−EBX; регистры сохраняются."><rect class="byte-hit" x="802" y="198" width="44" height="36" rx="4" fill="transparent" /><text x="807" y="227" font-size="27" fill="#e4eee6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">D8</text></g><text x="955" y="276" font-size="29" fill="#89f9b0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">je equal</text><g data-byte="74" data-byte-hint="JE: переход при текущем ZF=1, здесь подготовлен последним CMP."><rect class="byte-hit" x="753" y="247" width="44" height="36" rx="4" fill="transparent" /><text x="758" y="276" font-size="27" fill="#e4eee6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">74</text></g><g data-byte="07" data-byte-hint="Смещение +7 до equal в примере с двумя ветками, от конца JE."><rect class="byte-hit" x="802" y="247" width="44" height="36" rx="4" fill="transparent" /><text x="807" y="276" font-size="27" fill="#e4eee6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">07</text></g><text x="758" y="313" font-size="24" fill="#91a99a" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ZF: 0 от INC → 1 от CMP</text><text x="758" y="351" font-size="25" fill="#89f9b0" text-anchor="start" font-family="Inter, Arial, sans-serif">JE сработала: числа равны</text><text x="700" y="416" font-size="26" fill="#89f9b0" text-anchor="middle" font-family="Inter, Arial, sans-serif">Флаги: проверяем, какая инструкция изменила их последней.</text></svg>
