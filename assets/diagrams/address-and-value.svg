<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 470" role="img" aria-labelledby="title desc">
  <title id="title">Адрес переменной и значение в памяти</title>
  <desc id="desc">Переменная counter из секции data занимает восемь байтов и содержит 0x1122334455667788. MOV без скобок получает адрес её первого байта, MOV со скобками читает все восемь байтов. Линии увеличения соединяют точные границы data и образа программы.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#89f9b0"/></marker></defs>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="24" y="24" fill="#91a99a" font-size="19">ПЕРЕМЕННАЯ СО СЛАЙДА 20</text>
    <text x="24" y="61" fill="#e4eee6" font-size="26">counter dq 0x1122334455667788</text>
    <text x="24" y="90" fill="#91a99a" font-size="19">dq: записать значение размером 8 байт</text>
    <rect x="24" y="116" width="490" height="116" rx="4" fill="#0c1510" stroke="#40614b" stroke-width="2"/>
    <text x="46" y="148" fill="#91a99a" font-size="18">КОПИРУЕМ АДРЕС</text>
    <text x="46" y="184" fill="#e4eee6" font-size="26">mov rax, counter</text>
    <text x="46" y="215" fill="#89f9b0" font-size="22">RAX = 0x600000</text>
    <rect x="24" y="269" width="490" height="116" rx="4" fill="#0c1510" stroke="#40614b" stroke-width="2"/>
    <text x="46" y="301" fill="#91a99a" font-size="18">ЧИТАЕМ ЗНАЧЕНИЕ ИЗ ПАМЯТИ</text>
    <text x="46" y="337" fill="#e4eee6" font-size="26">mov rax, [counter]</text>
    <text x="46" y="368" fill="#89f9b0" font-size="22">RAX = 0x1122334455667788</text>
    <text x="24" y="432" fill="#e4eee6" font-family="Inter, Arial, sans-serif" font-size="22">counter — адрес начала; [counter] — данные по адресу.</text>

    <text x="813" y="24" fill="#91a99a" font-size="19" text-anchor="middle">ПЕРЕМЕННАЯ В .data</text>
    <rect x="665" y="48" width="300" height="342" fill="#08100b" stroke="#40614b" stroke-width="2"/>
    <text x="684" y="80" fill="#91a99a" font-size="18">адрес</text><text x="886" y="80" fill="#91a99a" font-size="18">байт</text>
    <g stroke="#40614b" stroke-width="1.5">
      <rect x="680" y="96" width="270" height="35" fill="#153020" stroke="#89f9b0" stroke-width="2"/>
      <rect x="680" y="131" width="270" height="35" fill="#102019"/>
      <rect x="680" y="166" width="270" height="35" fill="#102019"/>
      <rect x="680" y="201" width="270" height="35" fill="#102019"/>
      <rect x="680" y="236" width="270" height="35" fill="#102019"/>
      <rect x="680" y="271" width="270" height="35" fill="#102019"/>
      <rect x="680" y="306" width="270" height="35" fill="#102019"/>
      <rect x="680" y="341" width="270" height="35" fill="#102019"/>
    </g>
    <g font-size="21">
      <text x="694" y="121" fill="#89f9b0">0x600000</text><text x="893" y="121" fill="#e4eee6">88</text>
      <text x="694" y="156" fill="#91a99a">0x600001</text><text x="893" y="156" fill="#e4eee6">77</text>
      <text x="694" y="191" fill="#91a99a">0x600002</text><text x="893" y="191" fill="#e4eee6">66</text>
      <text x="694" y="226" fill="#91a99a">0x600003</text><text x="893" y="226" fill="#e4eee6">55</text>
      <text x="694" y="261" fill="#91a99a">0x600004</text><text x="893" y="261" fill="#e4eee6">44</text>
      <text x="694" y="296" fill="#91a99a">0x600005</text><text x="893" y="296" fill="#e4eee6">33</text>
      <text x="694" y="331" fill="#91a99a">0x600006</text><text x="893" y="331" fill="#e4eee6">22</text>
      <text x="694" y="366" fill="#91a99a">0x600007</text><text x="893" y="366" fill="#e4eee6">11</text>
    </g>
    <g stroke="#89f9b0" stroke-width="2.3" fill="none">
      <path d="M514 174H557V113.5H678" marker-end="url(#arrow)"/>
      <path d="M514 327H584V248H641" marker-end="url(#arrow)"/>
      <path d="M658 96H645V376H658"/>
    </g>
    <text x="542" y="102" fill="#89f9b0" font-size="17">первый байт</text>
    <text x="590" y="277" fill="#89f9b0" font-size="17">8 байт</text>
    <text x="815" y="422" fill="#91a99a" font-size="18" text-anchor="middle">Младший байт первым: 88 → … → 11.</text>

    <text x="1111" y="24" fill="#91a99a" font-size="17" text-anchor="middle">ОБРАЗ ПРОГРАММЫ</text>
    <g stroke="#40614b" stroke-width="2">
      <rect x="1035" y="48" width="152" height="85.5" fill="#102019"/>
      <rect x="1035" y="133.5" width="152" height="85.5" fill="#0e1c16"/>
      <rect x="1035" y="219" width="152" height="85.5" fill="#153020" stroke="#89f9b0" stroke-width="3"/>
      <rect x="1035" y="304.5" width="152" height="85.5" fill="#0e1c16"/>
    </g>
    <g text-anchor="middle" font-size="22"><text x="1111" y="98" fill="#91a99a">.text</text><text x="1111" y="183" fill="#91a99a">.rodata</text><text x="1111" y="269" fill="#89f9b0">.data</text><text x="1111" y="354" fill="#91a99a">.bss</text></g>
    <text x="1310" y="16" fill="#91a99a" font-size="17" text-anchor="middle">ВИРТУАЛЬНАЯ</text><text x="1310" y="36" fill="#91a99a" font-size="17" text-anchor="middle">ПАМЯТЬ ПРОЦЕССА</text>
    <g stroke="#40614b" stroke-width="2">
      <rect x="1240" y="48" width="140" height="82" fill="#102019"/>
      <rect x="1240" y="130" width="140" height="102" fill="#08100b" stroke-dasharray="7 6"/>
      <rect x="1240" y="232" width="140" height="78" fill="#102019"/>
      <rect x="1240" y="310" width="140" height="80" fill="#153020" stroke="#89f9b0" stroke-width="3"/>
    </g>
    <g text-anchor="middle" font-size="17"><text x="1310" y="98" fill="#91a99a">СТЕК</text><text x="1310" y="190" fill="#617568">СВОБОДНО</text><text x="1310" y="280" fill="#91a99a">КУЧА</text><text x="1310" y="344" fill="#89f9b0">ОБРАЗ</text><text x="1310" y="368" fill="#89f9b0">ПРОГРАММЫ</text></g>
    <g stroke="#89f9b0" stroke-width="1.8" fill="none" stroke-dasharray="6 5">
      <path d="M965 48L1035 219"/><path d="M965 390L1035 304.5"/>
      <path d="M1187 48L1240 310"/><path d="M1187 390H1240"/>
    </g>
  </g>
</svg>
