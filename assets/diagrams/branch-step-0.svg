<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
<title id="title">Условный переход JE или JNE</title>
<desc id="desc">Выбранные EAX и EBX сравниваются командой CMP. JE проверяет ZF=1, JNE — ZF=0. Ветка перехода записывает 1 в ECX, другая ветка — 0; обе сходятся на done.</desc>
<defs><marker id="green" data-jump-marker="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#89f9b0"/></marker><marker id="muted" data-jump-marker="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#40614b"/></marker></defs>
<text x="28" y="28" fill="#91a99a" font-size="21" font-family="Inter, Arial, sans-serif" text-anchor="start" >КОД В ПАМЯТИ · ФРАГМЕНТ .text</text>
