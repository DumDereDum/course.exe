<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc"><title id="title">Как читать таблицу Hex Editor</title><desc id="desc">Две строки из файла abs и подсветка байта 7D по смещению 0x1008.</desc><text x="24" y="30" fill="#91a99a" font-size="22" font-family="Inter, Arial, sans-serif">ФРАГМЕНТ abs · СХЕМА ОКНА HEX EDITOR</text><rect x="20" y="52" width="1360" height="182" rx="8" fill="#0c1510" stroke="#40614b" stroke-width="2"/><text x="36" y="88" fill="#91a99a" font-size="22" font-family="Inter, Arial, sans-serif">Смещение</text><text x="224" y="88" fill="#91a99a" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">00</text><text x="272" y="88" fill="#91a99a" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">01</text><text x="320" y="88" fill="#91a99a" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">02</text><text x="368" y="88" fill="#91a99a" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">03</text><text x="416" y="88" fill="#91a99a" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">04</text><text x="464" y="88" fill="#91a99a" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">05</text><text x="512" y="88" fill="#91a99a" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">06</text><text x="560" y="88" fill="#91a99a" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">07</text><text x="608" y="88" fill="#91a99a" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">08</text><text x="656" y="88" fill="#91a99a" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">09</text><text x="704" y="88" fill="#91a99a" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0A</text><text x="752" y="88" fill="#91a99a" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0B</text><text x="800" y="88" fill="#91a99a" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0C</text><text x="848" y="88" fill="#91a99a" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0D</text><text x="896" y="88" fill="#91a99a" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0E</text><text x="944" y="88" fill="#91a99a" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0F</text><text x="1030" y="88" fill="#91a99a" font-size="23" font-family="Inter, Arial, sans-serif">Decoded Text</text><rect x="602" y="100" width="44" height="48" rx="8" fill="#153020" stroke="#89f9b0" stroke-width="2"/><text x="36" y="136" fill="#89f9b0" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">00001000</text><text x="36" y="190" fill="#91a99a" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">00001010</text><g data-byte="B8" data-byte-hint="MOV EAX, imm32: записать 32-битную константу в EAX."><rect class="byte-hit" x="220" y="109" width="42" height="36" rx="4" fill="transparent"/><text x="224" y="136" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">B8</text></g><g data-byte="F9" data-byte-hint="Байт 1 из 4 числа −7: F9 FF FF FF; little-endian, младший байт первым."><rect class="byte-hit" x="268" y="109" width="42" height="36" rx="4" fill="transparent"/><text x="272" y="136" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">F9</text></g><g data-byte="FF" data-byte-hint="Байт 2 из 4 числа −7: F9 FF FF FF; little-endian, младший байт первым."><rect class="byte-hit" x="316" y="109" width="42" height="36" rx="4" fill="transparent"/><text x="320" y="136" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">FF</text></g><g data-byte="FF" data-byte-hint="Байт 3 из 4 числа −7: F9 FF FF FF; little-endian, младший байт первым."><rect class="byte-hit" x="364" y="109" width="42" height="36" rx="4" fill="transparent"/><text x="368" y="136" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">FF</text></g><g data-byte="FF" data-byte-hint="Байт 4 из 4 числа −7: F9 FF FF FF; little-endian, младший байт первым."><rect class="byte-hit" x="412" y="109" width="42" height="36" rx="4" fill="transparent"/><text x="416" y="136" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">FF</text></g><g data-byte="83" data-byte-hint="CMP с 8-битной константой, расширяемой со знаком."><rect class="byte-hit" x="460" y="109" width="42" height="36" rx="4" fill="transparent"/><text x="464" y="136" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">83</text></g><g data-byte="F8" data-byte-hint="ModR/M: сравнение регистра EAX с константой."><rect class="byte-hit" x="508" y="109" width="42" height="36" rx="4" fill="transparent"/><text x="512" y="136" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">F8</text></g><g data-byte="00" data-byte-hint="Константа 0 для сравнения EAX с нулём."><rect class="byte-hit" x="556" y="109" width="42" height="36" rx="4" fill="transparent"/><text x="560" y="136" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">00</text></g><g data-byte="7D" data-byte-hint="JGE: переход при signed ≥, условие SF = OF."><rect class="byte-hit" x="604" y="109" width="42" height="36" rx="4" fill="transparent"/><text x="608" y="136" fill="#89f9b0" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">7D</text></g><g data-byte="02" data-byte-hint="Смещение +2 от конца JGE: 0x100A + 2 = 0x100C."><rect class="byte-hit" x="652" y="109" width="42" height="36" rx="4" fill="transparent"/><text x="656" y="136" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">02</text></g><g data-byte="F7" data-byte-hint="Группа операций F7; следующий байт выбирает NEG."><rect class="byte-hit" x="700" y="109" width="42" height="36" rx="4" fill="transparent"/><text x="704" y="136" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">F7</text></g><g data-byte="D8" data-byte-hint="ModR/M: NEG над EAX, изменить знак числа."><rect class="byte-hit" x="748" y="109" width="42" height="36" rx="4" fill="transparent"/><text x="752" y="136" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">D8</text></g><g data-byte="89" data-byte-hint="MOV: копирование 32-битного регистра."><rect class="byte-hit" x="796" y="109" width="42" height="36" rx="4" fill="transparent"/><text x="800" y="136" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">89</text></g><g data-byte="C7" data-byte-hint="ModR/M: источник EAX, назначение EDI."><rect class="byte-hit" x="844" y="109" width="42" height="36" rx="4" fill="transparent"/><text x="848" y="136" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">C7</text></g><g data-byte="B8" data-byte-hint="MOV EAX, imm32: номер системного вызова."><rect class="byte-hit" x="892" y="109" width="42" height="36" rx="4" fill="transparent"/><text x="896" y="136" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">B8</text></g><g data-byte="3C" data-byte-hint="Байт 1 из 4 числа 60: 3C 00 00 00; little-endian, младший байт первым."><rect class="byte-hit" x="940" y="109" width="42" height="36" rx="4" fill="transparent"/><text x="944" y="136" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">3C</text></g><g data-byte="00" data-byte-hint="Байт 2 из 4 числа 60: 3C 00 00 00; little-endian, младший байт первым."><rect class="byte-hit" x="220" y="163" width="42" height="36" rx="4" fill="transparent"/><text x="224" y="190" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">00</text></g><g data-byte="00" data-byte-hint="Байт 3 из 4 числа 60: 3C 00 00 00; little-endian, младший байт первым."><rect class="byte-hit" x="268" y="163" width="42" height="36" rx="4" fill="transparent"/><text x="272" y="190" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">00</text></g><g data-byte="00" data-byte-hint="Байт 4 из 4 числа 60: 3C 00 00 00; little-endian, младший байт первым."><rect class="byte-hit" x="316" y="163" width="42" height="36" rx="4" fill="transparent"/><text x="320" y="190" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">00</text></g><g data-byte="0F" data-byte-hint="Первый байт двухбайтовой кодировки SYSCALL."><rect class="byte-hit" x="364" y="163" width="42" height="36" rx="4" fill="transparent"/><text x="368" y="190" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0F</text></g><g data-byte="05" data-byte-hint="Второй байт SYSCALL: вызов ядра Linux, EAX = 60 — exit."><rect class="byte-hit" x="412" y="163" width="42" height="36" rx="4" fill="transparent"/><text x="416" y="190" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">05</text></g><g data-byte="00" data-byte-hint="Байт после конца показанного кода .text; не инструкция этого примера."><rect class="byte-hit" x="460" y="163" width="42" height="36" rx="4" fill="transparent"/><text x="464" y="190" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">00</text></g><g data-byte="00" data-byte-hint="Байт после конца показанного кода .text; не инструкция этого примера."><rect class="byte-hit" x="508" y="163" width="42" height="36" rx="4" fill="transparent"/><text x="512" y="190" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">00</text></g><g data-byte="00" data-byte-hint="Байт после конца показанного кода .text; не инструкция этого примера."><rect class="byte-hit" x="556" y="163" width="42" height="36" rx="4" fill="transparent"/><text x="560" y="190" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">00</text></g><g data-byte="00" data-byte-hint="Байт после конца показанного кода .text; не инструкция этого примера."><rect class="byte-hit" x="604" y="163" width="42" height="36" rx="4" fill="transparent"/><text x="608" y="190" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">00</text></g><g data-byte="00" data-byte-hint="Байт после конца показанного кода .text; не инструкция этого примера."><rect class="byte-hit" x="652" y="163" width="42" height="36" rx="4" fill="transparent"/><text x="656" y="190" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">00</text></g><g data-byte="00" data-byte-hint="Байт после конца показанного кода .text; не инструкция этого примера."><rect class="byte-hit" x="700" y="163" width="42" height="36" rx="4" fill="transparent"/><text x="704" y="190" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">00</text></g><g data-byte="00" data-byte-hint="Байт после конца показанного кода .text; не инструкция этого примера."><rect class="byte-hit" x="748" y="163" width="42" height="36" rx="4" fill="transparent"/><text x="752" y="190" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">00</text></g><g data-byte="00" data-byte-hint="Байт после конца показанного кода .text; не инструкция этого примера."><rect class="byte-hit" x="796" y="163" width="42" height="36" rx="4" fill="transparent"/><text x="800" y="190" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">00</text></g><g data-byte="00" data-byte-hint="Байт после конца 