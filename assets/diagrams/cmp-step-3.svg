<text x="510" y="135" fill="#91a99a" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">mov eax, 7</text>
<text x="852" y="135" fill="#91a99a" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">5</text>
<g data-byte="B8" data-byte-hint="MOV: записать 32-битную константу в EAX. Верхние 32 бита RAX обнуляются. Флаги не меняются.">
