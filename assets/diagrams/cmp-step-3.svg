<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
<title id="title">CMP — состояние 4</title>
<desc id="desc">Mov записала 3 в EBX. ZF остался равен 1: это ещё результат предыдущего cmp. Новые данные в EBX. Флаги пока от предыдущего сравнения.</desc>
<defs><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#89f9b0"/></marker></defs>
<text x="28" y="28" fill="#91a99a" font-size="21" font-family="Inter, Arial, sans-serif" text-anchor="start">КОД В ПАМЯТИ · ФРАГМЕНТ .text</text>
<rect x="24" y="48" width="906" height="350" rx="10" fill="#0c1510" stroke="#40614b" stroke-width="2"/>
