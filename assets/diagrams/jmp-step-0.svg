<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
<title id="title">Метки и jmp — состояние 1</title>
<desc id="desc">RIP указывает на mov eax, 10. Значение RAX до выполнения фрагмента не задано. Метка skip обозначает адрес инструкции sub и сама не занимает байты. В таблице показаны машинные байты каждой инструкции, проверенные сборкой NASM.</desc>
<defs><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#89f9b0" /></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#40614b" /></marker></defs>
<text x="28" y="28" fill="#91a99a" font-size="21" font-family="Inter, Arial, sans-serif" text-anchor="start">КОД В ПАМЯТИ · ФРАГМЕНТ .text</text>
<rect x="24" y="48" width="906" height="350" rx="10" fill="#0c1510" stroke="#40614b" stroke-width="2" />
<text x="45" y="80" fill="#91a99a" font-size="18" font-family="Inter, Arial, sans-serif" text-anchor="start">АДРЕС</text>
<text x="230" y="80" fill="#91a99a" font-size="18" font-family="Inter, Arial, sans-serif" text-anchor="start">БАЙТЫ</text>
<text x="480" y="80" fill="#91a99a" font-size="18" font-family="Inter, Arial, sans-serif" text-anchor="start">МЕТКА</text>
<text x="595" y="80" fill="#91a99a" font-size="18" font-family="Inter, Arial, sans-serif" text-anchor="start">ИНСТРУКЦИЯ</text>
<path d="M25 98H929" stroke="#40614b" />
<rect x="25" y="103" width="904" height="55" rx="6" fill="#153020" />
<path d="M26 103V158" stroke="#89f9b0" stroke-width="4" />
<text x="45" y="139" fill="#89f9b0" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">0x401000</text>
<text x="480" y="139" fill="#89f9b0" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" />
<g data-byte="B8" data-byte-hint="MOV: записать 32-битную константу в EAX. Верхние 32 бита RAX обнуляются."><rect class="byte-hit" x="225" y="112" width="40" height="34" rx="4" fill="transparent" /><text x="230" y="139" fill="#89f9b0" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">B8</text></g><g data-byte="0A" data-byte-hint="Байт 1 из 4 константы 10. Вся константа: 0A 00 00 00, младший байт первым (little-endian)."><rect class="byte-hit" x="270" y="112" width="40" height="34" rx="4" fill="transparent" /><text x="275" y="139" fill="#89f9b0" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">0A</text></g><g data-byte="00" data-byte-hint="Байт 2 из 4 константы 10. Вся константа: 0A 00 00 00, младший байт первым (little-endian)."><rect class="byte-hit" x="315" y="112" width="40" height="34" rx="4" fill="transparent" /><text x="320" y="139" fill="#89f9b0" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">00</text></g><g data-byte="00" data-byte-hint="Байт 3 из 4 константы 10. Вся константа: 0A 00 00 00, младший байт первым (little-endian)."><rect class="byte-hit" x="360" y="112" width="40" height="34" rx="4" fill="transparent" /><text x="365" y="139" fill="#89f9b0" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">00</text></g><g data-byte="00" data-byte-hint="Байт 4 из 4 константы 10. Вся константа: 0A 00 00 00, младший байт первым (little-endian)."><rect class="byte-hit" x="405" y="112" width="40" height="34" rx="4" fill="transparent" /><text x="410" y="139" fill="#89f9b0" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">00</text></g><text x="595" y="139" fill="#89f9b0" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">mov eax, 10</text>
<text x="45" y="197" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">0x401005</text>
<text x="480" y="197" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" />
<g data-byte="EB" data-byte-hint="JMP: короткий безусловный переход с 8-битным знаковым смещением."><rect class="byte-hit" x="225" y="170" width="40" height="34" rx="4" fill="transparent" /><text x="230" y="197" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">EB</text></g><g data-byte="04" data-byte-hint="Смещение +4 байта от адреса после jmp: 0x401007 + 4 = 0x40100B (skip)."><rect class="byte-hit" x="270" y="170" width="40" height="34" rx="4" fill="transparent" /><text x="275" y="197" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">04</text></g><text x="595" y="197" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">jmp skip</text>
<text x="45" y="255" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">0x401007</text>
<text x="480" y="255" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" />
<g data-byte="48" data-byte-hint="Префикс REX.W: следующие операнды имеют размер 64 бита."><rect class="byte-hit" x="225" y="228" width="40" height="34" rx="4" fill="transparent" /><text x="230" y="255" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">48</text></g><g data-byte="83" data-byte-hint="Группа арифметики с 8-битной константой. Конкретную операцию задаёт следующий байт ModR/M."><rect class="byte-hit" x="270" y="228" width="40" height="34" rx="4" fill="transparent" /><text x="275" y="255" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">83</text></g><g data-byte="C0" data-byte-hint="ModR/M: код операции /0 выбирает ADD; назначение — регистр RAX."><rect class="byte-hit" x="315" y="228" width="40" height="34" rx="4" fill="transparent" /><text x="320" y="255" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">C0</text></g><g data-byte="05" data-byte-hint="Константа +5: один байт, расширяется со знаком до размера операнда."><rect class="byte-hit" x="360" y="228" width="40" height="34" rx="4" fill="transparent" /><text x="365" y="255" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">05</text></g><text x="595" y="255" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">add rax, 5</text>
<text x="45" y="313" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">0x40100B</text>
<text x="480" y="313" fill="#89f9b0" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">skip:</text>
<g data-byte="48" data-byte-hint="Префикс REX.W: следующие операнды имеют размер 64 бита."><rect class="byte-hit" x="225" y="286" width="40" height="34" rx="4" fill="transparent" /><text x="230" y="313" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">48</text></g><g data-byte="83" data-byte-hint="Группа арифметики с 8-битной константой. Конкретную операцию задаёт следующий байт ModR/M."><rect class="byte-hit" x="270" y="286" width="40" height="34" rx="4" fill="transparent" /><text x="275" y="313" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">83</text></g><g data-byte="E8" data-byte-hint="ModR/M: код операции /5 выбирает SUB; назначение — регистр RAX."><rect class="byte-hit" x="315" y="286" width="40" height="34" rx="4" fill="transparent" /><text x="320" y="313" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">E8</text></g><g data-byte="02" data-byte-hint="Константа +2: один байт, расширяется со знаком до размера операнда."><rect class="byte-hit" x="360" y="286" width="40" height="34" rx="4" fill="transparent" /><text x="365" y="313" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">02</text></g><text x="595" y="313" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">sub rax, 2</text>
<text x="45" y="371" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">0x40100F</text>
<text x="480" y="371" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" />
<text x="230" y="371" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">…</text>
<text x="595" y="371" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">дальше…</text>
<path d="M799 189H898V305H799" fill="none" stroke="#40614b" stroke-width="2" stroke-linejoin="round" marker-end="url(#muted)" />
<rect x="1030" y="48" width="346" height="156" rx="10" fill="#153020" stroke="#89f9b0" stroke-width="3" />
<text x="1203" y="88" fill="#89f9b0" font-size="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">RIP</text>
<text x="1203" y="145" fill="#e4eee6" font-size="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">0x401000</text>
<text x="1203" y="180" fill="#91a99a" font-size="21" font-family="Inter, Arial, sans-serif" text-anchor="middle">куда продолжить</text>
<path d="M1030 127H978V130H932" fill="none" stroke="#89f9b0" stroke-width="3" stroke-linejoin="round" marker-end="url(#green)" />
<rect x="1030" y="234" width="346" height="111" rx="10" fill="#0c1510" stroke="#40614b" stroke-width="2" />
<text x="1055" y="274" fill="#89f9b0" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">RAX</text>
<text x="1320" y="304" fill="#e4eee6" font-size="46" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">—</text>
<text x="1203" y="378" fill="#91a99a" font-size="22" font-family="Inter, Arial, sans-serif" text-anchor="middle">jmp меняет адрес</text>
<text x="1203" y="405" fill="#91a99a" font-size="21" font-family="Inter, Arial, sans-serif" text-anchor="middle">RAX при jmp сохраняется</text>
<text x="28" y="426" fill="#91a99a" font-size="20" font-family="Inter, Arial, sans-serif" text-anchor="start">Метка — имя адреса. Отдельной инструкции для неё нет.</text>
</svg>
