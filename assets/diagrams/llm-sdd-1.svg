<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 300" role="img"><rect width="1400" height="300" fill="none"/><rect x="40" y="40" width="620" height="220" rx="10" fill="#0c1510" stroke="#2b4434" stroke-width="2"/><text x="60" y="66" fill="#91a99a" font-size="15" font-family="Inter, Arial, sans-serif" xml:space="preserve" text-anchor="start">ЗАДАЧА</text><text x="60" y="100" fill="#91a99a" font-size="16" font-family="Inter, Arial, sans-serif" xml:space="preserve" text-anchor="start">задачи нет — есть только</text><text x="60" y="130" fill="#91a99a" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">&gt; сделай красиво</text><text x="60" y="190" fill="#91a99a" font-size="16" font-family="Inter, Arial, sans-serif" xml:space="preserve" text-anchor="start">что получится — неизвестно</text><rect x="680" y="40" width="680" height="220" rx="10" fill="#0c1510" stroke="#2b4434" stroke-width="2"/><text x="700" y="66" fill="#91a99a" font-size="15" font-family="Inter, Arial, sans-serif" xml:space="preserve" text-anchor="start">РЕЗУЛЬТАТ</text><text x="700" y="150" fill="#89f9b0" font-size="60" font-family="Inter, Arial, sans-serif" xml:space="preserve" text-anchor="start">?</text><text x="760" y="150" fill="#e4eee6" font-size="18" font-family="Inter, Arial, sans-serif" xml:space="preserve" text-anchor="start">модель догадывается сама</text></svg>