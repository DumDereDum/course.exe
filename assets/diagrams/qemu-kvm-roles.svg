<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 305" role="img" aria-labelledby="title desc">
  <title id="title">Роли QEMU и KVM</title>
  <desc id="desc">Гостевая ОС выполняет обычный код через KVM, а к виртуальным диску и сети обращается через устройства QEMU. QEMU создаёт и запускает виртуальную машину через KVM. Оба используют ресурсы Linux-хоста.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10" fill="#89f9b0"/>
    </marker>
  </defs>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <g fill="none" stroke="#89f9b0" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M500 65L280 119"/>
      <path d="M700 65L920 119"/>
      <path d="M476 164H724"/>
      <path d="M280 207L470 249"/>
      <path d="M920 207L730 249"/>
    </g>
    <g fill="#91a99a" font-size="20" text-anchor="middle">
      <text x="210" y="97">I/O-запросы</text>
      <text x="990" y="97">инструкции</text>
      <text x="600" y="149">создаёт ВМ и vCPU</text>
      <text x="600" y="192">запускает: KVM_RUN</text>
    </g>
    <g fill="#0c1510" stroke="#40614b" stroke-width="2">
      <rect x="420" y="3" width="360" height="62" rx="3"/>
      <rect x="70" y="120" width="400" height="87" rx="3"/>
      <rect x="730" y="120" width="400" height="87" rx="3"/>
      <rect x="350" y="250" width="500" height="52" rx="3"/>
    </g>
    <g text-anchor="middle">
      <g fill="#89f9b0" font-size="19">
        <text x="600" y="26">ВИРТУАЛЬНАЯ МАШИНА</text>
        <text x="270" y="145">ПРОЦЕСС LINUX</text>
        <text x="930" y="145">МОДУЛЬ ЯДРА LINUX</text>
      </g>
      <g fill="#e4eee6" font-size="29">
        <text x="600" y="55">Гостевая ОС</text>
        <text x="270" y="176">QEMU</text>
        <text x="930" y="176">KVM</text>
        <text x="600" y="279">Ресурсы Linux-хоста</text>
      </g>
      <g fill="#91a99a" font-size="19">
        <text x="270" y="199">диск · сеть · устройства</text>
        <text x="930" y="199">код гостя на физическом CPU</text>
        <text x="600" y="300">CPU · память · хранилище · сеть</text>
      </g>
    </g>
  </g>
</svg>
