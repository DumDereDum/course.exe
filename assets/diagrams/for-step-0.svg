<text x="1362" y="384" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end" data-loop-iterations="">0</text><path d="M1203 296V398M1030 347H1376" stroke="#40614b" /><g data-order-flag="sf"><rect class="order-highlight" x="1031" y="297" width="171" height="49" rx="6" fill="#153020" stroke="#89f9b0" stroke-width="1.5" opacity="0" /><text x="1053" y="331" fill="#89f9b0" font-size="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">SF</text><text x="1152" y="333" fill="#e4eee6" font-size="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" data-jump-sf="">—</text></g><g data-order-flag="of"><rect class="order-highlight" x="1204" y="297" width="171" height="49" rx="6" fill="#153020" stroke="#89f9b0" stroke-width="1.5" opacity="0" /><text x="1226" y="331" fill="#89f9b0" font-size="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">OF</text><text x="1325" y="333" fill="#e4eee6" font-size="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" data-jump-of="">—</text></g><text x="1226" y="382" fill="#89f9b0" font-size="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">итераций</text><text x="1030" y="289" fill="#91a99a" font-size="18" font-family="Inter, Arial, sans-serif" data-loop-flag-source="">Флаги от: —</text><text x="45" y="420" fill="#91a99a" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" data-loop-history="">EAX: —</text><g data-jump-row="0"><rect class="jump-highlight" x="25" y="105" width="904" height="38" rx="6" fill="#153020" opacity="1" /><text x="45" y="135" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0x401000</text><text x="595" y="135" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">mov eax, 0</text><g data-byte="B8" data-byte-hint="MOV EAX, imm32: запись 32-битной константы в EAX. Код B8 задаёт EAX, флаги сохраняются."><rect class="byte-hit" x="225" y="108" width="40" height="34" rx="4" fill="transparent" /><text x="230" y="135" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">B8</text></g><g data-byte="00" data-byte-hint="Байт 1 из 4 константы 0: 00 00 00 00, порядок little-endian."><rect class="byte-hit" x="270" y="108" width="40" height="34" rx="4" fill="transparent" /><text x="275" y="135" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">00</text></g><g data-byte="00" data-byte-hint="Байт 2 из 4 константы 0: 00 00 00 00, порядок little-endian."><rect class="byte-hit" x="315" y="108" width="40" height="34" rx="4" fill="transparent" /><text x="320" y="135" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">00</text></g><g data-byte="00" data-byte-hint="Байт 3 из 4 константы 0: 00 00 00 00, порядок little-endian."><rect class="byte-hit" x="360" y="108" width="40" height="34" rx="4" fill="transparent" /><text x="365" y="135" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">00</text></g><g data-byte="00" data-byte-hint="Байт 4 из 4 константы 0: 00 00 00 00, порядок little-endian."><rect class="byte-hit" x="405" y="108" width="40" height="34" rx="4" fill="transparent" /><text x="410" y="135" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">00</text></g></g><g data-jump-row="1"><rect class="jump-highlight" x="25" y="145" width="904" height="38" rx="6" fill="#153020" opacity="0" /><text x="45" y="175" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0x401005</text><text x="480" y="175" fill="#89f9b0" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" class="jump-label">check:</text><text x="595" y="175" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cmp eax, ebx</text><g data-byte="39" data-byte-hint="CMP r/m32, r32: вычитание для флагов без записи результата."><rect class="byte-hit" x="225" y="148" width="40" height="34" rx="4" fill="transparent" /><text x="230" y="175" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">39</text></g><g data-byte="D8" data-byte-hint="ModR/M: 11 | 011 | 000. Сравниваем EAX с EBX: флаги по EAX−EBX."><rect class="byte-hit" x="270" y="148" width="40" height="34" rx="4" fill="transparent" /><text x="275" y="175" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">D8</text></g></g><g data-jump-row="2"><rect class="jump-highlight" x="25" y="185" width="904" height="38" rx="6" fill="#153020" opacity="0" /><text x="45" y="215" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0x401007</text><text x="595" y="215" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">jge done</text><g data-byte="7D" data-byte-hint="JGE: короткий знаковый переход при SF = OF. После CMP EAX,EBX это выход при EAX ≥ EBX."><rect class="byte-hit" x="225" y="188" width="40" height="34" rx="4" fill="transparent" /><text x="230" y="215" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">7D</text></g><g data-byte="07" data-byte-hint="Смещение +7 байтов: 0x401009 + 7 = 0x401010 (done). Отсчёт от конца JGE."><rect class="byte-hit" x="270" y="188" width="40" height="34" rx="4" fill="transparent" /><text x="275" y="215" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">07</text></g></g><g data-jump-row="3"><rect class="jump-highlight" x="25" y="225" width="904" height="38" rx="6" fill="#153020" opacity="0" /><text x="45" y="255" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0x401009</text><text x="595" y="255" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">add ecx, 2</text><g data-byte="83" data-byte-hint="Код группы 83: операция с 32-битным операндом и знаково расширяемой 8-битной константой. /0 в ModR/M выбирает ADD."><rect class="byte-hit" x="225" y="228" width="40" height="34" rx="4" fill="transparent" /><text x="230" y="255" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">83</text></g><g data-byte="C1" data-byte-hint="ModR/M: 11 | 000 | 001. 11 — регистр, /0 — ADD, r/m=001 — ECX."><rect class="byte-hit" x="270" y="228" width="40" height="34" rx="4" fill="transparent" /><text x="275" y="255" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">C1</text></g><g data-byte="02" data-byte-hint="Константа +2 в одном байте: 02. ADD ECX,2 увеличивает результат на 2 и обновляет флаги."><rect class="byte-hit" x="315" y="228" width="40" height="34" rx="4" fill="transparent" /><text x="320" y="255" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">02</text></g></g><g data-jump-row="4"><rect class="jump-highlight" x="25" y="265" width="904" height="38" rx="6" fill="#153020" opacity="0" /><text x="45" y="295" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0x40100C</text><text x="595" y="295" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">inc eax</text><g data-byte="FF" data-byte-hint="Код группы FF. Расширение /0 в ModR/M выбирает INC 32-битного операнда."><rect class="byte-hit" x="225" y="268" width="40" height="34" rx="4" fill="transparent" /><text x="230" y="295" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">FF</text></g><g data-byte="C0" data-byte-hint="ModR/M: 11 | 000 | 000. /0 — INC, регистр EAX. Увеличивает EAX на 1; SF/OF обновляются, CF сохраняется."><rect class="byte-hit" x="270" y="268" width="40" height="34" rx="4" fill="transparent" /><text x="275" y="295" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">C0</text></g></g><g data-jump-row="5"><rect class="jump-highlight" x="25" y="305" width="904" height="38" rx="6" fill="#153020" opacity="0" /><text x="45" y="335" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0x40100E</text><text x="595" y="335" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">jmp check</text><g data-byte="EB" data-byte-hint="JMP rel8: короткий безусловный относительный переход. Флаги сохраняются."><rect class="byte-hit" x="225" y="308" width="40" height="34" rx="4" fill="transparent" /><text x="230" y="335" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">EB</text></g><g data-byte="F5" data-byte-hint="F5 — знаковое 8-битное смещение −11. 0x401010 − 11 = 0x401005 (check), от конца JMP. Инициализация по 0x401000 пропускается."><rect class="byte-hit" x="270" y="308" width="40" height="34" rx="4" fill="transparent" /><text x="275" y="335" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">F5</text></g></g><g data-jump-row="6"><rect class="jump-highlight" x="25" y="345" width="904" height="38" rx="6" fill="#153020" opacity="0" /><text x="45" y="375" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0x401010</text><text x="480" y="375" fill="#89f9b0" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" class="jump-label">done:</text><text x="595" y="375" fill="#e4eee6" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">дальше…</text><text x="230" y="375" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">…</text></g><text x="590" y="420" fill="#91a99a" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" data-loop-value-history="">ECX: 0</text><text x="1053" y="382" fill="#89f9b0" font-size="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ECX</text><text x="1152" y="384" fill="#e4eee6" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" data-jump-ecx="">0</text></g><rect x="10" y="48" width="310" height="350" rx="10" fill="#0c1510" stroke="#40614b" stroke-width="2" /><text x="28" y="84" fill="#91a99a" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">C · signed int</text><text x="28" y="126" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" data-loop-cline="init" xml:space="preserve">for (int i = 0;</text><text x="28" y="166" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" data-loop-cline="condition" xml:space="preserve">     i &lt; limit;</text><text x="28" y="206" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" data-loop-cline="update" xml:space="preserve">     i++) {</text><text x="28" y="246" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" data-loop-cline="body" xml:space="preserve">  value += 2;</text><text x="28" y="286" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" data-loop-cline="exit" xml:space="preserve">}</text><text x="28" y="319" fill="#91a99a" font-size="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">i → EAX</text><text x="28" y="351" fill="#91a99a" font-size="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">limit → EBX</text><text x="28" y="383" fill="#91a99a" font-size="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">value → ECX</text></svg>
