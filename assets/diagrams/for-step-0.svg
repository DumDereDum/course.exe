<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1740 430" role="img" aria-labelledby="title desc">
<title id="title">FOR: инициализация, проверка, тело и изменение счётчика</title>
<desc id="desc">Слева FOR на C, в центре машинный код с байтами. EAX — счётчик, EBX — граница, ECX — результат; возврат на CMP, минуя MOV EAX,0.</desc>
