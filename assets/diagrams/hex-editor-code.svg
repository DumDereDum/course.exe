<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc"><title id="title">Инструкции abs в машинных байтах</title><desc id="desc">Семь инструкций abs с файловыми смещениями; MOV EAX,60 пересекает границу строки.</desc><text x="24" y="30" fill="#91a99a" font-size="22" font-family="Inter, Arial, sans-serif">СМЕЩЕНИЯ В ФАЙЛЕ И БАЙТЫ ИЗ abs</text><text x="28" y="71" fill="#91a99a" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">OFF</text><text x="200" y="71" fill="#91a99a" font-size="22" font-family="Inter, Arial, sans-serif">БАЙТЫ</text><text x="475" y="71" fill="#91a99a" font-size="22" font-family="Inter, Arial, sans-serif">ИНСТРУКЦИЯ</text><text x="28" y="111" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0x1000</text><g data-byte="B8" data-byte-hint="MOV EAX, imm32: записать 32-битную константу в EAX."><rect class="byte-hit" x="196" y="84" width="42" height="36" rx="4" fill="transparent"/><text x="200" y="111" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">B8</text></g><g data-byte="F9" data-byte-hint="Байт 1 из 4 числа −7: F9 FF FF FF; little-endian, младший байт первым."><rect class="byte-hit" x="244" y="84" width="42" height="36" rx="4" fill="transparent"/><text x="248" y="111" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">F9</text></g><g data-byte="FF" data-byte-hint="Байт 2 из 4 числа −7: F9 FF FF FF; little-endian, младший байт первым."><rect class="byte-hit" x="292" y="84" width="42" height="36" rx="4" fill="transparent"/><text x="296" y="111" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">FF</text></g><g data-byte="FF" data-byte-hint="Байт 3 из 4 числа −7: F9 FF FF FF; little-endian, младший байт первым."><rect class="byte-hit" x="340" y="84" width="42" height="36" rx="4" fill="transparent"/><text x="344" y="111" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">FF</text></g><g data-byte="FF" data-byte-hint="Байт 4 из 4 числа −7: F9 FF FF FF; little-endian, младший байт первым."><rect class="byte-hit" x="388" y="84" width="42" height="36" rx="4" fill="transparent"/><text x="392" y="111" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">FF</text></g><text x="475" y="111" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">mov eax, -7</text><text x="28" y="154" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0x1005</text><g data-byte="83" data-byte-hint="CMP с 8-битной константой, расширяемой со знаком."><rect class="byte-hit" x="196" y="127" width="42" height="36" rx="4" fill="transparent"/><text x="200" y="154" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">83</text></g><g data-byte="F8" data-byte-hint="ModR/M: сравнение регистра EAX с константой."><rect class="byte-hit" x="244" y="127" width="42" height="36" rx="4" fill="transparent"/><text x="248" y="154" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">F8</text></g><g data-byte="00" data-byte-hint="Константа 0 для сравнения EAX с нулём."><rect class="byte-hit" x="292" y="127" width="42" height="36" rx="4" fill="transparent"/><text x="296" y="154" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">00</text></g><text x="475" y="154" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cmp eax, 0</text><text x="28" y="197" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0x1008</text><g data-byte="7D" data-byte-hint="JGE: переход при signed ≥, условие SF = OF."><rect class="byte-hit" x="196" y="170" width="42" height="36" rx="4" fill="transparent"/><text x="200" y="197" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">7D</text></g><g data-byte="02" data-byte-hint="Смещение +2 от конца JGE: 0x100A + 2 = 0x100C."><rect class="byte-hit" x="244" y="170" width="42" height="36" rx="4" fill="transparent"/><text x="248" y="197" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">02</text></g><text x="475" y="197" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">jge nonnegative</text><text x="28" y="240" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0x100A</text><g data-byte="F7" data-byte-hint="Группа операций F7; следующий байт выбирает NEG."><rect class="byte-hit" x="196" y="213" width="42" height="36" rx="4" fill="transparent"/><text x="200" y="240" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">F7</text></g><g data-byte="D8" data-byte-hint="ModR/M: NEG над EAX, изменить знак числа."><rect class="byte-hit" x="244" y="213" width="42" height="36" rx="4" fill="transparent"/><text x="248" y="240" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">D8</text></g><text x="475" y="240" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">neg eax</text><text x="28" y="283" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0x100C</text><g data-byte="89" data-byte-hint="MOV: копирование 32-битного регистра."><rect class="byte-hit" x="196" y="256" width="42" height="36" rx="4" fill="transparent"/><text x="200" y="283" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">89</text></g><g data-byte="C7" data-byte-hint="ModR/M: источник EAX, назначение EDI."><rect class="byte-hit" x="244" y="256" width="42" height="36" rx="4" fill="transparent"/><text x="248" y="283" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">C7</text></g><text x="475" y="283" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">mov edi, eax</text><rect x="20" y="296" width="798" height="40" rx="8" fill="#153020" stroke="#89f9b0" stroke-width="2"/><text x="28" y="326" fill="#89f9b0" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0x100E</text><g data-byte="B8" data-byte-hint="MOV EAX, imm32: номер системного вызова."><rect class="byte-hit" x="196" y="299" width="42" height="36" rx="4" fill="transparent"/><text x="200" y="326" fill="#89f9b0" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">B8</text></g><g data-byte="3C" data-byte-hint="Байт 1 из 4 числа 60: 3C 00 00 00; little-endian, младший байт первым."><rect class="byte-hit" x="244" y="299" width="42" height="36" rx="4" fill="transparent"/><text x="248" y="326" fill="#89f9b0" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">3C</text></g><g data-byte="00" data-byte-hint="Байт 2 из 4 числа 60: 3C 00 00 00; little-endian, младший байт первым."><rect class="byte-hit" x="292" y="299" width="42" height="36" rx="4" fill="transparent"/><text x="296" y="326" fill="#89f9b0" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">00</text></g><g data-byte="00" data-byte-hint="Байт 3 из 4 числа 60: 3C 00 00 00; little-endian, младший байт первым."><rect class="byte-hit" x="340" y="299" width="42" height="36" rx="4" fill="transparent"/><text x="344" y="326" fill="#89f9b0" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">00</text></g><g data-byte="00" data-byte-hint="Байт 4 из 4 числа 60: 3C 00 00 00; little-endian, младший байт первым."><rect class="byte-hit" x="388" y="299" width="42" height="36" rx="4" fill="transparent"/><text x="392" y="326" fill="#89f9b0" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">00</text></g><text x="475" y="326" fill="#89f9b0" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">mov eax, 60</text><text x="28" y="369" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0x1013</text><g data-byte="0F" data-byte-hint="Первый байт двухбайтовой кодировки SYSCALL."><rect class="byte-hit" x="196" y="342" width="42" height="36" rx="4" fill="transparent"/><text x="200" y="369" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0F</text></g><g data-byte="05" data-byte-hint="Второй байт SYSCALL: вызов ядра Linux, EAX = 60 — exit."><rect class="byte-hit" x="244" y="342" width="42" height="36" rx="4" fill="transparent"/><text x="248" y="369" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">05</text></g><text x="475" y="369" fill="#e4eee6" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">syscall</text><text x="860" y="78" fill="#91a99a" font-size="25" font-family="Inter, Arial, sans-serif">В Docker · /work</text><text x="860" y="121" fill="#89f9b0" font-size="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">objdump -d -M intel build/abs</text><text x="860" y="155" fill="#91a99a" font-size="23" font-family="Inter, Arial, sans-serif">-d — код; -M intel — синтаксис</text><text x="860" y="219" fill="#e4eee6" font-size="27" font-family="Inter, Arial, sans-serif">MOV начинается в 0E,</text><text x="860" y="256" fill="#e4eee6" font-size="27" font-family="Inter, Arial, sans-serif">продолжается в строке 1010.</text><text x="860" y="315" fill="#89f9b0" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">readelf -S build/abs</text><text x="860" y="356" fill="#e4eee6" font-size="25" font-family="Inter, Arial, sans-serif">Off — файл; Address — память.</text><text x="24" y="425" fill="#91a99a" font-size="24" font-family="Inter, Arial, sans-serif">Границы строк редактора не задают границы инструкций. Здесь .text = 21 байт.</text></svg>
