<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 470" role="img" aria-labelledby="title desc">
  <title id="title">Секции внутри образа программы</title>
  <desc id="desc">Справа сохранена общая карта памяти со стеком, кучей и образом программы. Образ программы увеличен и разделён на text, rodata, data и bss; строки исходника указывают на соответствующие секции.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#89f9b0"/></marker></defs>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="28" y="20" fill="#91a99a" font-size="17">ИСХОДНЫЙ ФАЙЛ</text>
    <g fill="#0c1510" stroke="#40614b" stroke-width="2"><rect x="24" y="32" width="570" height="86" rx="4"/><rect x="24" y="132" width="570" height="86" rx="4"/><rect x="24" y="232" width="570" height="86" rx="4"/><rect x="24" y="332" width="570" height="86" rx="4"/></g>
    <g font-size="21"><text x="50" y="66" fill="#89f9b0">section .text</text><text x="50" y="96" fill="#e4eee6">_start: mov rax, 60</text><text x="50" y="166" fill="#89f9b0">section .rodata</text><text x="50" y="196" fill="#e4eee6">message db "Hello", 10</text><text x="50" y="266" fill="#89f9b0">section .data</text><text x="50" y="296" fill="#e4eee6">counter dq 0x1122334455667788</text><text x="50" y="366" fill="#89f9b0">section .bss</text><text x="50" y="396" fill="#e4eee6">buffer resb 64</text></g>
    <g stroke="#89f9b0" stroke-width="2.3" fill="none" marker-end="url(#arrow)"><path d="M594 75H748"/><path d="M594 175H748"/><path d="M594 275H748"/><path d="M594 375H748"/></g>
    <text x="908" y="20" fill="#91a99a" font-size="17" text-anchor="middle">ОБРАЗ ПРОГРАММЫ — УВЕЛИЧЕНО</text>
    <g stroke="#40614b" stroke-width="2"><rect x="760" y="32" width="300" height="86" fill="#102019"/><rect x="760" y="132" width="300" height="86" fill="#0e1c16"/><rect x="760" y="232" width="300" height="86" fill="#102019"/><rect x="760" y="332" width="300" height="86" fill="#0e1c16"/></g>
    <g text-anchor="middle"><text x="910" y="70" fill="#89f9b0" font-size="27">.text</text><text x="910" y="98" fill="#91a99a" font-size="16">инструкции · R-X</text><text x="910" y="170" fill="#89f9b0" font-size="27">.rodata</text><text x="910" y="198" fill="#91a99a" font-size="16">константы · R--</text><text x="910" y="270" fill="#89f9b0" font-size="27">.data</text><text x="910" y="298" fill="#91a99a" font-size="16">начальные данные · RW-</text><text x="910" y="370" fill="#89f9b0" font-size="27">.bss</text><text x="910" y="398" fill="#91a99a" font-size="16">нули после загрузки · RW-</text></g>
    <g stroke="#89f9b0" stroke-width="2" fill="none" stroke-dasharray="7 6"><path d="M1060 32L1172 321"/><path d="M1060 418L1172 418"/></g>
    <text x="1275" y="12" fill="#91a99a" font-size="17" text-anchor="middle">ВИРТУАЛЬНАЯ ПАМЯТЬ</text><text x="1275" y="30" fill="#91a99a" font-size="17" text-anchor="middle">ПРОЦЕССА</text>
    <g stroke="#40614b" stroke-width="2"><rect x="1180" y="32" width="190" height="88" fill="#102019"/><rect x="1180" y="120" width="190" height="116" fill="#08100b" stroke-dasharray="7 6"/><rect x="1180" y="236" width="190" height="78" fill="#102019"/><rect x="1180" y="314" width="190" height="104" fill="#153020" stroke="#89f9b0" stroke-width="3"/></g>
    <g text-anchor="middle"><text x="1275" y="83" fill="#91a99a" font-size="20">СТЕК</text><text x="1275" y="184" fill="#617568" font-size="17">СВОБОДНО</text><text x="1275" y="282" fill="#91a99a" font-size="20">КУЧА</text><text x="1275" y="352" fill="#89f9b0" font-size="18">ОБРАЗ</text><text x="1275" y="377" fill="#89f9b0" font-size="18">ПРОГРАММЫ</text><text x="1275" y="401" fill="#91a99a" font-size="14">увеличен слева</text></g>
  </g>
</svg>
